<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de formulario y DOM</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <header class="mb-4 text-center">
                    <h1 class="h2">Formulario de registro</h1>
                    <p class="text-body-secondary mb-0">
                        Completa los campos para tu registro.
                    </p>
                </header>

                <section class="card shadow-sm">
                    <div class="card-body p-4">
                        <form id="registro-form">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="nombre"
                                    name="nombre"
                                    autocomplete="name"
                                    required
                                >
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="fecha" class="form-label">Fecha de nacimiento</label>
                                    <input
                                        type="date"
                                        class="form-control"
                                        id="fecha"
                                        name="fecha"
                                        required
                                    >
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="edad" class="form-label">Edad</label>
                                    <input
                                        type="number"
                                        class="form-control"
                                        id="edad"
                                        name="edad"
                                        min="0"
                                        max="120"
                                        inputmode="numeric"
                                        required
                                    >
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label">Número telefónico</label>
                                <input
                                    type="tel"
                                    class="form-control"
                                    id="telefono"
                                    name="telefono"
                                    autocomplete="tel"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label for="cedula" class="form-label">Cédula</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="cedula"
                                    name="cedula"
                                    autocomplete="off"
                                    required
                                >
                            </div>

                            <div class="d-flex flex-wrap gap-2">
                                <button type="submit" class="btn btn-primary">
                                    Mostrar datos
                                </button>
                                <button type="reset" class="btn btn-outline-secondary">
                                    Limpiar
                                </button>
                            </div>
                        </form>
                    </div>
                </section>

                <section
                    id="resultado"
                    class="card mt-4 d-none"
                    aria-live="polite"
                    aria-labelledby="resultado-titulo"
                >
                    <div class="card-body">
                        <h2 id="resultado-titulo" class="h5">Datos ingresados</h2>
                        <dl class="row mb-0">
                            <dt class="col-sm-4">Nombre completo</dt>
                            <dd class="col-sm-8" id="salida-nombre"></dd>

                            <dt class="col-sm-4">Fecha de nacimiento</dt>
                            <dd class="col-sm-8" id="salida-fecha"></dd>

                            <dt class="col-sm-4">Edad</dt>
                            <dd class="col-sm-8" id="salida-edad"></dd>

                            <dt class="col-sm-4">Número telefónico</dt>
                            <dd class="col-sm-8" id="salida-telefono"></dd>

                            <dt class="col-sm-4">Cédula</dt>
                            <dd class="col-sm-8" id="salida-cedula"></dd>
                        </dl>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
